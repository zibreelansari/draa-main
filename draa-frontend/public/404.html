<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page Not Found - MyEdudocs</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #5e6bff;
      --primary-hover: #4b55e6;
      --bg-gradient: linear-gradient(135deg, #f4f6ff 0%, #e8ecff 100%);
      --text-main: #1e1e2f;
      --text-muted: #5e6577;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.4);
      --shadow: 0 20px 40px rgba(94, 107, 255, 0.08);
      --card-shadow: 0 30px 60px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    /* Ambient glow backgrounds */
    .glow-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(94, 107, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
      top: -100px;
      left: -100px;
      z-index: 0;
      animation: float-slow 10s ease-in-out infinite;
    }

    .glow-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(94, 107, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      bottom: -100px;
      right: -100px;
      z-index: 0;
      animation: float-slow 12s ease-in-out infinite reverse;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: var(--card-shadow), var(--shadow);
      position: relative;
      z-index: 1;
      animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* SVG Illustration styling */
    .illustration-wrapper {
      margin-bottom: 32px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 140px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #5e6bff 0%, #3d4ecc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      margin-bottom: 8px;
      animation: pulse 3s infinite ease-in-out;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .btn-primary {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(94, 107, 255, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(94, 107, 255, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Navigation Links Matrix */
    .links-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(94, 107, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: #ffffff;
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(94, 107, 255, 0.05);
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    /* Animations */
    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes float-slow {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-20px) scale(1.05);
      }
    }

    /* Responsive adjustments */
    @media (min-width: 480px) {
      .button-group {
        flex-direction: row;
      }
      
      .nav-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 540px;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 20px;
      }
      .error-code {
        font-size: 100px;
      }
      h1 {
        font-size: 22px;
      }
      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    
    <div class="card">
      <div class="illustration-wrapper">
        <div class="error-code">404</div>
      </div>
      
      <h1>Oops! Page Not Found</h1>
      <p>We can't seem to find the page you're looking for. It might have been removed, renamed, or is temporarily unavailable.</p>
      
      <div class="button-group">
        <a href="/" class="btn-primary" id="back-home-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Home
        </a>
      </div>

      <h2 class="links-title">Explore MyEdudocs</h2>
      <div class="nav-grid">
        <a href="/courses" class="nav-link" id="nav-courses">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
          Courses
        </a>
        <a href="/all-books" class="nav-link" id="nav-books">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9.004 9.004 0 0 0 8.716-6.747A4.998 4.998 0 0 0 16 9.5H8a4.998 4.998 0 0 0-4.716 4.753A9.004 9.004 0 0 0 12 21Z"/><path d="M16 9.5V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v5.5"/></svg>
          Books
        </a>
        <a href="/online-test-series" class="nav-link" id="nav-exams">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9Z"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Test Series
        </a>
        <a href="/current-affairs" class="nav-link" id="nav-ca">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M16 9l-4 4-2-2-4 4"/></svg>
          Current Affairs
        </a>
        <a href="/previous-year-questions" class="nav-link" id="nav-pyq">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          PYQs
        </a>
        <a href="/contact" class="nav-link" id="nav-contact">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Contact Us
        </a>
      </div>
    </div>
  </div>

</body>
</html>
